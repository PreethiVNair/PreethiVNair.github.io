
name: Convert Notebook to HTML

on:
  push:
    branches: [main]
    paths:
      - "**/*.ipynb"
      - ".github/workflows/notebook-to-html.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  convert:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install nbconvert
        run: python -m pip install nbconvert

      - name: Convert notebook to HTML
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess

          notebooks = [
              p for p in Path(".").rglob("*.ipynb")
              if ".ipynb_checkpoints" not in p.parts
              and ".venv" not in p.parts
          ]

          if not notebooks:
              raise SystemExit("No Jupyter notebooks found.")

          for notebook in notebooks:
              subprocess.run(
                  ["jupyter", "nbconvert", "--to", "html", str(notebook)],
                  check=True
              )
          PY

      - name: Commit HTML files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.html'
          if ! git diff --cached --quiet; then
            git commit -m "Generate HTML from notebooks"
            git push
          fi
